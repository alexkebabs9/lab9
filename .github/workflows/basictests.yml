name: Lab 9 Basic Tests

on:
  push:
    branches:
      - main
      - test

jobs:
  lab9-basic-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run test 1
        run: |
          result=$(bash validate-data.sh "pearse mccarthy" "0831122334")
          echo "$result"
          test "$result" = "PASS"

      - name: Run test 2
        run: |
          result=$(bash validate-data.sh "pearse mccarthy" "08311223344")
          echo "$result"
          test "$result" = "FAIL"

      - name: Run test 3
        run: |
          result=$(bash validate-data.sh "pearse mccarthy testing" "0831122334")
          echo "$result"
          test "$result" = "FAIL"
